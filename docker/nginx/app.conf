# Single origin serving both the built Vue SPA (respondent wizard) and
# proxying Laravel/Filament routes to PHP-FPM. No separate api.* subdomain needed.
server {
    listen 80;
    server_name validador.comunidadeppg.com.br _;

    client_max_body_size 20M;

    # Vue build output (SPA) — default root.
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Laravel front-controller routes: API, Filament admin, Livewire, Sanctum.
    location ~ ^/(api|admin|livewire|sanctum)(/|$) {
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel/Filament static assets (published CSS/JS/fonts, storage symlink,
    # any vendor-published assets, Laravel's own build manifest if ever used).
    location ~ ^/(storage|vendor|css|js|fonts|images|build)/ {
        root /var/www/public;
        try_files $uri =404;
    }

    location = /favicon.ico {
        root /var/www/public;
        try_files $uri =404;
    }

    # PHP front controller.
    location ~ \.php$ {
        root /var/www/public;
        fastcgi_pass validador_api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Everything else: Vue SPA (respondent wizard), e.g. /v/paoflix.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
